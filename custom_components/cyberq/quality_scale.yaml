rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register service actions
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: todo
  config-flow:
    status: todo
    comment: Add data_description for host and port in strings.json
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not register service actions
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities only subscribe to the coordinator
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: todo
    comment: async_set raises raw ValueError and aiohttp errors
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: Integration has no options flow
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: CyberQ devices do not require authentication
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: CyberQ does not support discovery
  discovery:
    status: exempt
    comment: CyberQ does not support discovery
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry is a single fixed device
  entity-category: done
  entity-device-class:
    status: todo
    comment: >-
      Proportional band and alarm deviation are temperature deltas but use
      the temperature device class
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: Select entities set _attr_name, overriding the translated name
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: No user-actionable repair conditions
  stale-devices:
    status: exempt
    comment: Each config entry is a single fixed device

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: todo
    comment: Not checked with mypy --strict; cyberq.py relies heavily on Any
